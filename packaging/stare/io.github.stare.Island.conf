<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root, that is PAM, may announce terminal face scans to GNOME Shell. -->
<busconfig>
  <policy context="default">
    <deny send_interface="io.github.stare.Island"/>
  </policy>
  <policy user="root">
    <allow send_interface="io.github.stare.Island"/>
  </policy>
</busconfig>
